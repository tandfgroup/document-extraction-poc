<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF Metadata POC</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf_viewer.min.css">
<style>
  :root {
    --border: #e5e7eb;
    --bg: #f9fafb;
    --accent: #fbbf24;
    --primary: #2563eb;
    --capture: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #111; }
  body { display: flex; }

  /* Form on right */
  #form {
    flex: 0 0 420px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-left: 1px solid var(--border);
    order: 2;
  }
  #form header {
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--border);
    background: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #form header h2 { margin: 0; font-size: 1rem; }
  #form-body { padding: 1rem; overflow-y: auto; flex: 1; }
  .field { margin-bottom: 1rem; }
  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.3rem;
    color: #374151;
  }
  .field-row { display: flex; gap: 0.5rem; align-items: stretch; }
  .field-row.col { flex-direction: column; }
  .field input, .field textarea {
    flex: 1;
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1.4;
    background: white;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field textarea { resize: vertical; min-height: 8rem; }
  .field.active input,
  .field.active textarea {
    border-color: var(--capture);
    box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
  }
  .select-btn {
    padding: 0.4rem 0.7rem;
    border: 1px solid var(--primary);
    color: var(--primary);
    background: white;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
    white-space: nowrap;
    flex: 0 0 auto;
    align-self: flex-start;
  }
  .field-row:not(.col) .select-btn { align-self: stretch; }
  .select-btn:hover { background: #eff6ff; }
  .select-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    border-color: var(--border);
    color: #6b7280;
    background: #f3f4f6;
  }
  .spinner {
    display: none;
    width: 12px;
    height: 12px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -1px;
    margin-right: 6px;
  }
  button.loading .spinner { display: inline-block; }
  button.loading { cursor: progress; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(2px);
    z-index: 9999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    user-select: none;
  }
  body.busy #loading-overlay { display: flex; }
  body.busy { cursor: progress; }
  .big-spinner {
    width: 72px;
    height: 72px;
    border: 6px solid rgba(255, 255, 255, 0.25);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 1.25rem;
  }
  #loading-text {
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .field.active .select-btn {
    background: var(--capture);
    color: white;
    border-color: var(--capture);
  }
  #capture-hint {
    margin-top: 0.5rem;
    padding: 0.6rem 0.8rem;
    border-radius: 4px;
    background: #fef3c7;
    border: 1px solid #fcd34d;
    color: #92400e;
    font-size: 0.85rem;
    display: none;
  }
  #capture-hint.visible { display: block; }
  #capture-hint kbd {
    background: white;
    border: 1px solid #fcd34d;
    border-radius: 3px;
    padding: 0 0.3rem;
    font-family: ui-monospace, monospace;
    font-size: 0.78rem;
  }

  /* PDF on left */
  #right {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    order: 1;
  }
  #toolbar {
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
    background: white;
    display: flex;
    gap: 0.6rem;
    align-items: center;
  }
  #toolbar label { font-size: 0.9rem; color: #555; }
  #pdf-container {
    flex: 1;
    overflow: auto;
    background: #525659;
    padding: 1.5rem;
  }
  .page {
    position: relative;
    margin: 0 auto 1rem;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .page .textLayer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    line-height: 1;
    opacity: 1;
    text-align: initial;
    transform-origin: 0 0;
    z-index: 2;
  }
  .page .textLayer span,
  .page .textLayer br {
    color: transparent;
    position: absolute;
    white-space: pre;
    cursor: text;
    transform-origin: 0% 0%;
    pointer-events: auto;
  }
  .page .textLayer span.markedContent { top: 0; height: 0; }
  .page .textLayer span[data-line-number] {
    user-select: none !important;
    -webkit-user-select: none !important;
    pointer-events: none !important;
    background: rgba(239, 68, 68, 0.25) !important;
    outline: 1px solid #ef4444;
  }
  /* Bbox overlays — single source of truth for all field highlights */
  .bbox-overlay {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    border-radius: 2px;
    transition: opacity 0.15s;
  }
  .bbox-overlay.title { background: rgba(37, 99, 235, 0.18); border: 1.5px solid #2563eb; }
  .bbox-overlay.abstract { background: rgba(22, 163, 74, 0.18); border: 1.5px solid #16a34a; }
  .bbox-overlay.keywords { background: rgba(168, 85, 247, 0.20); border: 1.5px solid #a855f7; }
  .bbox-overlay.flash { animation: bbox-flash 1.1s ease-out; }
  @keyframes bbox-flash {
    0%   { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); transform: scale(1); }
    20%  { box-shadow: 0 0 0 12px rgba(250, 204, 21, 0.7); transform: scale(1.04); }
    100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); transform: scale(1); }
  }
  .field input,
  .field textarea,
  .field .quill-wrap,
  .field label[for] {
    cursor: pointer;
  }
  .field input:not(:placeholder-shown),
  .field textarea:not(:placeholder-shown),
  .field label[for] {
    /* hint that clicking jumps */
  }
  .page .textLayer ::selection {
    background: rgba(251, 191, 36, 0.45);
    color: transparent;
  }
  body.capturing .page .textLayer ::selection {
    background: rgba(239, 68, 68, 0.4);
  }
  .page canvas { display: block; position: relative; z-index: 1; }
</style>
</head>
<body>
  <div id="loading-overlay">
    <div class="big-spinner"></div>
    <div id="loading-text">Extracting metadata...</div>
  </div>
  <div id="form">
    <header>
      <h2>Metadata</h2>
      <button id="export" class="select-btn" type="button">Copy JSON</button>
    </header>
    <div id="form-body">
      <div class="field" data-field="title">
        <label for="f-title">Title</label>
        <div class="field-row">
          <input id="f-title" type="text" placeholder="Paper title" readonly>
          <button class="select-btn" data-target="title" data-mode="replace" type="button">Select</button>
        </div>
      </div>
      <div class="field" data-field="abstract">
        <label for="f-abstract">Abstract</label>
        <div class="field-row col">
          <textarea id="f-abstract" rows="10" placeholder="Abstract" readonly></textarea>
          <button class="select-btn" data-target="abstract" data-mode="replace" type="button">Select</button>
        </div>
      </div>
      <div class="field" data-field="keywords">
        <label for="f-keywords">Keywords</label>
        <div class="field-row col">
          <input id="f-keywords" type="text" placeholder="Comma-separated" readonly>
          <button class="select-btn" data-target="keywords" data-mode="append-csv" type="button">Add keyword</button>
        </div>
      </div>
      <div id="capture-hint">
        Highlight text in the PDF to populate <strong id="capture-target"></strong>. Press <kbd>Esc</kbd> to cancel.
      </div>
    </div>
  </div>

  <div id="right">
    <div id="toolbar">
      <input type="file" id="file-input" accept="application/pdf">
      <label>Scale
        <input type="range" id="scale" min="0.5" max="3" step="0.25" value="1.5">
      </label>
      <button id="extract-btn" class="select-btn" type="button" disabled><span class="spinner"></span><span id="extract-label">Extract metadata</span></button>
      <span id="status" style="color:#6b7280;font-size:0.85rem;"></span>
    </div>
    <div id="pdf-container"></div>
  </div>

  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.worker.min.mjs';

    const fileInput = document.getElementById('file-input');
    const scaleInput = document.getElementById('scale');
    const status = document.getElementById('status');
    const container = document.getElementById('pdf-container');
    const captureHint = document.getElementById('capture-hint');
    const captureTargetLabel = document.getElementById('capture-target');
    const exportBtn = document.getElementById('export');

    const FIELDS = {
      title: { input: document.getElementById('f-title'), label: 'Title' },
      abstract: { input: document.getElementById('f-abstract'), label: 'Abstract' },
      keywords: { input: document.getElementById('f-keywords'), label: 'Keywords' },
    };

    let currentPdf = null;
    let currentPdfBytes = null;
    let currentPdfName = '';
    let captureField = null;
    let captureMode = null;
    const fieldBboxes = { title: [], abstract: [], keywords: [] };

    const EXTRACT_API = 'http://localhost:8001';

    // ----- PDF rendering -----

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = `Loading ${file.name}...`;
      currentPdfBytes = new Uint8Array(await file.arrayBuffer());
      currentPdfName = file.name;
      currentPdf = await pdfjsLib.getDocument({ data: currentPdfBytes.slice() }).promise;
      await renderAll();
      document.getElementById('extract-btn').disabled = false;
      runExtraction();
    });

    scaleInput.addEventListener('change', () => { if (currentPdf) renderAll(); });

    async function renderAll() {
      container.innerHTML = '';
      const scale = parseFloat(scaleInput.value);
      status.textContent = `Rendering ${currentPdf.numPages} pages...`;
      for (let i = 1; i <= currentPdf.numPages; i++) {
        await renderPage(i, scale);
      }
      status.textContent = `${currentPdf.numPages} pages`;
      redrawAllOverlays();
    }

    async function renderPage(pageNum, scale) {
      const page = await currentPdf.getPage(pageNum);
      const viewport = page.getViewport({ scale });

      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';
      pageDiv.dataset.page = pageNum;
      pageDiv.style.width = viewport.width + 'px';
      pageDiv.style.height = viewport.height + 'px';

      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      pageDiv.appendChild(canvas);

      const textLayerDiv = document.createElement('div');
      textLayerDiv.className = 'textLayer';
      textLayerDiv.style.setProperty('--scale-factor', scale);
      pageDiv.appendChild(textLayerDiv);

      container.appendChild(pageDiv);

      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

      const textLayer = new pdfjsLib.TextLayer({
        textContentSource: page.streamTextContent({ includeMarkedContent: true }),
        container: textLayerDiv,
        viewport,
      });
      await textLayer.render();

      tagLineNumbers(textLayerDiv);
    }

    // Tag spans that look like margin line numbers (numeric span isolated in left or right margin).
    function tagLineNumbers(layer) {
      const spans = Array.from(layer.querySelectorAll('span:not(.markedContent)'))
        .filter((s) => (s.textContent || '').trim());
      if (spans.length < 5) return;

      // Bucket into lines
      const lines = [];
      for (const span of spans) {
        const top = parseScaledPx(span.style.top);
        const size = parseScaledPx(span.style.fontSize) || 12;
        const tol = Math.max(2, size * 0.3);
        const line = lines.find((l) => Math.abs(l.top - top) < tol);
        if (line) line.spans.push(span);
        else lines.push({ top, spans: [span] });
      }
      for (const line of lines) {
        line.spans.sort((a, b) => parseScaledPx(a.style.left) - parseScaledPx(b.style.left));
      }

      // Determine body left/right edges from non-numeric spans
      const bodyLefts = [];
      const bodyRights = [];
      for (const line of lines) {
        for (const span of line.spans) {
          const text = (span.textContent || '').trim();
          if (!/^\d+$/.test(text)) {
            bodyLefts.push(parseScaledPx(span.style.left));
            break;
          }
        }
        for (let i = line.spans.length - 1; i >= 0; i--) {
          const span = line.spans[i];
          const text = (span.textContent || '').trim();
          if (!/^\d+$/.test(text)) {
            const left = parseScaledPx(span.style.left);
            const w = span.getBoundingClientRect().width || 0;
            bodyRights.push(left + w);
            break;
          }
        }
      }
      if (!bodyLefts.length) return;
      bodyLefts.sort((a, b) => a - b);
      bodyRights.sort((a, b) => a - b);
      const medianBodyLeft = bodyLefts[Math.floor(bodyLefts.length / 2)];
      const medianBodyRight = bodyRights[Math.floor(bodyRights.length / 2)] || Infinity;

      const margin = 8;
      for (const line of lines) {
        for (const span of line.spans) {
          const text = (span.textContent || '').trim();
          if (!/^\d{1,4}$/.test(text)) continue;
          const left = parseScaledPx(span.style.left);
          const w = span.getBoundingClientRect().width || 0;
          const right = left + w;
          // Left-margin number OR right-margin number
          if (left < medianBodyLeft - margin || right > medianBodyRight + margin) {
            span.dataset.lineNumber = '1';
          }
        }
      }
    }

    // ----- Capture mode -----

    function fieldEl(field) {
      return document.querySelector(`.field[data-field="${field}"]`);
    }

    function enterCapture(field, mode) {
      captureField = field;
      captureMode = mode;
      document.body.classList.add('capturing');
      for (const k of Object.keys(FIELDS)) {
        fieldEl(k).classList.toggle('active', k === field);
      }
      document.querySelectorAll('.select-btn[data-target]').forEach((b) => {
        if (b.dataset.target === field) {
          b.textContent = 'Cancel';
        } else {
          b.disabled = true;
        }
      });
      captureTargetLabel.textContent = FIELDS[field].label;
      captureHint.classList.add('visible');
    }

    function exitCapture() {
      captureField = null;
      captureMode = null;
      document.body.classList.remove('capturing');
      document.querySelectorAll('.field').forEach((f) => f.classList.remove('active'));
      document.querySelectorAll('.select-btn[data-target]').forEach((b) => {
        b.disabled = false;
        b.textContent = b.dataset.target === 'keywords' ? 'Add keyword' : 'Select';
      });
      captureHint.classList.remove('visible');
    }

    document.querySelectorAll('.select-btn[data-target]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.target;
        if (captureField === target) exitCapture();
        else enterCapture(target, btn.dataset.mode);
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && captureField) exitCapture();
    });

    // ----- Selection capture -----

    container.addEventListener('mouseup', async () => {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed) return;
      if (sel.toString().trim() === '') return;
      const anchorNode = sel.anchorNode;
      if (!anchorNode || !container.contains(anchorNode)) return;
      if (!captureField) return;

      const text = selectionToText(sel);
      sel.removeAllRanges();
      await applySelection(text);
    });

    async function applySelection(text) {
      const field = captureField;
      const mode = captureMode;
      const { input } = FIELDS[field];
      exitCapture();

      // Optimistic fill with raw selection so the user sees something immediately.
      const tentative = cleanForField(text, field);
      if (mode === 'append-csv') {
        const existing = input.value.trim();
        input.value = existing ? `${existing}, ${tentative}` : tentative;
      } else {
        input.value = tentative;
      }

      let matches = [];
      setBusy(true, 'Locating selection...');
      try {
        matches = await fetchMatches(text);
      } catch (err) {
        console.warn('match failed', err);
      } finally {
        setBusy(false);
      }

      if (mode === 'append-csv') {
        // Keywords: keep user's selection text, just append the bboxes.
        fieldBboxes[field] = [...fieldBboxes[field], ...matches];
      } else {
        // Title / Abstract: replace text + bboxes with what the server actually
        // matched (so the field reflects the highlighted region exactly).
        const matchedText = matches.map((m) => m.text).filter(Boolean).join('\n');
        if (matchedText) input.value = cleanForField(matchedText, field);
        fieldBboxes[field] = matches;
      }
      redrawAllOverlays();
    }

    async function fetchMatches(text) {
      if (!currentPdfBytes) return [];
      const fd = new FormData();
      fd.append('pdf', new Blob([currentPdfBytes], { type: 'application/pdf' }), currentPdfName);
      fd.append('text', text);
      const res = await fetch(`${EXTRACT_API}/match`, { method: 'POST', body: fd });
      if (!res.ok) return [];
      const data = await res.json();
      return data.matches || [];
    }

    function cleanForField(text, field) {
      // Title and keywords are always single-line — collapse all whitespace.
      if (field === 'title' || field === 'keywords') {
        return text.replace(/\s+/g, ' ').trim();
      }
      // Abstract: preserve paragraph breaks; collapse whitespace within lines.
      return text
        .split(/\n{2,}/)
        .map((p) => p.replace(/\s+/g, ' ').trim())
        .filter(Boolean)
        .join('\n\n');
    }

    // PDF.js v4 emits style values as calc(var(--scale-factor)*Npx). Pull the N out.
    function parseScaledPx(value) {
      if (!value) return 0;
      const m = value.match(/([\d.]+)\s*px/);
      return m ? parseFloat(m[1]) : 0;
    }

    // Walk the selection range and emit text with paragraph breaks
    // detected via vertical gaps between lines.
    function selectionToText(sel) {
      const spans = [];
      for (let i = 0; i < sel.rangeCount; i++) {
        collectLeafSpans(sel.getRangeAt(i).cloneContents(), spans);
      }
      if (!spans.length) return sel.toString();

      const items = spans
        .map((s) => ({
          top: parseScaledPx(s.style.top),
          size: parseScaledPx(s.style.fontSize) || 12,
          text: s.textContent || '',
        }))
        .filter((it) => it.text.length > 0);
      if (!items.length) return sel.toString();

      // Bucket into lines (tolerance ~30% of font size)
      const lines = [];
      for (const it of items) {
        const tol = Math.max(2, it.size * 0.3);
        const line = lines.find((l) => Math.abs(l.top - it.top) < tol);
        if (line) {
          line.spans.push(it);
        } else {
          lines.push({ top: it.top, size: it.size, spans: [it] });
        }
      }
      lines.sort((a, b) => a.top - b.top);

      // Estimate typical line height (median gap)
      const gaps = [];
      for (let i = 1; i < lines.length; i++) gaps.push(lines[i].top - lines[i - 1].top);
      gaps.sort((a, b) => a - b);
      const medianGap = gaps[Math.floor(gaps.length / 2)] || lines[0].size * 1.4;

      // Build text: join spans on a line with a space; blank line if gap >> typical
      const out = [];
      for (let i = 0; i < lines.length; i++) {
        const lineText = lines[i].spans.map((s) => s.text).join('');
        if (i > 0) {
          const gap = lines[i].top - lines[i - 1].top;
          out.push(gap > medianGap * 1.6 ? '\n\n' : ' ');
        }
        out.push(lineText);
      }
      return out.join('');
    }

    function collectLeafSpans(node, out) {
      if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'SPAN' && !node.querySelector('span')) {
        if (node.dataset?.lineNumber === undefined) out.push(node);
        return;
      }
      for (const child of node.childNodes) collectLeafSpans(child, out);
    }

    // ----- Metadata extraction -----

    const extractBtn = document.getElementById('extract-btn');
    const extractLabel = document.getElementById('extract-label');

    extractBtn.addEventListener('click', runExtraction);

    const loadingText = document.getElementById('loading-text');

    function setBusy(on, text) {
      document.body.classList.toggle('busy', on);
      if (on && text) loadingText.textContent = text;
    }

    async function runExtraction() {
      if (!currentPdfBytes) return;
      extractBtn.disabled = true;
      extractBtn.classList.add('loading');
      extractLabel.textContent = 'Uploading...';
      setBusy(true, 'Uploading manuscript...');
      try {
        const fd = new FormData();
        fd.append('pdf', new Blob([currentPdfBytes], { type: 'application/pdf' }), currentPdfName);
        setBusy(true, 'Extracting metadata...');
        extractLabel.textContent = 'Extracting...';
        const res = await fetch(`${EXTRACT_API}/extract`, { method: 'POST', body: fd });
        if (!res.ok) throw new Error(`Extract failed: ${res.status}`);
        const data = await res.json();
        populateExtracted(data);
        drawBboxOverlays(data);
        extractBtn.classList.remove('loading');
        extractLabel.textContent = 'Extracted ✓';
        setTimeout(() => { extractLabel.textContent = 'Extract metadata'; extractBtn.disabled = false; }, 1500);
      } catch (err) {
        extractBtn.classList.remove('loading');
        extractLabel.textContent = `Failed: ${err.message.slice(0, 30)}`;
        setTimeout(() => { extractLabel.textContent = 'Extract metadata'; extractBtn.disabled = false; }, 3000);
      } finally {
        setBusy(false);
      }
    }

    function populateExtracted(data) {
      if (data.title) FIELDS.title.input.value = data.title;
      if (data.abstract) FIELDS.abstract.input.value = data.abstract;
      if (Array.isArray(data.keywords) && data.keywords.length) {
        FIELDS.keywords.input.value = data.keywords.join(', ');
      }
    }

    function drawBboxOverlays(data) {
      fieldBboxes.title = data.title_matches || [];
      fieldBboxes.abstract = data.abstract_matches || [];
      fieldBboxes.keywords = data.keywords_matches || [];
      redrawAllOverlays();
    }

    function redrawAllOverlays() {
      document.querySelectorAll('.bbox-overlay').forEach((o) => o.remove());
      const scale = parseFloat(scaleInput.value);
      const pages = document.querySelectorAll('.page');
      for (const field of ['title', 'abstract', 'keywords']) {
        for (const m of fieldBboxes[field] || []) {
          const pageDiv = pages[m.page];
          if (!pageDiv) continue;
          const [x0, y0, x1, y1] = m.bbox;
          const overlay = document.createElement('div');
          overlay.className = `bbox-overlay ${field}`;
          overlay.dataset.field = field;
          overlay.style.left = `${x0 * scale}px`;
          overlay.style.top = `${y0 * scale}px`;
          overlay.style.width = `${(x1 - x0) * scale}px`;
          overlay.style.height = `${(y1 - y0) * scale}px`;
          // Allow clicking an overlay to focus the relevant field
          overlay.style.pointerEvents = 'auto';
          overlay.style.cursor = 'pointer';
          overlay.addEventListener('click', (e) => {
            e.stopPropagation();
            const inp = FIELDS[field].input;
            if (inp && inp.focus) inp.focus();
            inp?.scrollIntoView?.({ block: 'nearest', behavior: 'smooth' });
            flashField(field);
          });
          pageDiv.appendChild(overlay);
        }
      }
    }

    function jumpToField(field) {
      const bboxes = fieldBboxes[field];
      if (!bboxes?.length) return;
      const first = bboxes[0];
      const pages = document.querySelectorAll('.page');
      const pageDiv = pages[first.page];
      if (!pageDiv) return;
      const scale = parseFloat(scaleInput.value);
      const targetY = pageDiv.offsetTop + first.bbox[1] * scale;
      container.scrollTo({ top: Math.max(0, targetY - 60), behavior: 'smooth' });
      flashField(field);
    }

    function flashField(field) {
      const overlays = document.querySelectorAll(`.bbox-overlay[data-field="${field}"]`);
      overlays.forEach((o) => {
        o.classList.remove('flash');
        // force reflow so the animation can replay
        void o.offsetWidth;
        o.classList.add('flash');
        setTimeout(() => o.classList.remove('flash'), 1200);
      });
    }

    // Wire each field input + label as a jump target.
    for (const [field, { input }] of Object.entries(FIELDS)) {
      const handler = (e) => {
        if (captureField) return; // don't hijack while user is in capture mode
        if (e.target.closest('.select-btn')) return;
        jumpToField(field);
      };
      input.addEventListener('click', handler);
      const labelEl = document.querySelector(`.field[data-field="${field}"] label`);
      if (labelEl) labelEl.addEventListener('click', handler);
    }

    // ----- Export -----

    exportBtn.addEventListener('click', async () => {
      const data = {
        title: FIELDS.title.input.value,
        abstract: FIELDS.abstract.input.value,
        keywords: FIELDS.keywords.input.value
          .split(',').map((s) => s.trim()).filter(Boolean),
      };
      const json = JSON.stringify(data, null, 2);
      try {
        await navigator.clipboard.writeText(json);
        exportBtn.textContent = 'Copied!';
        setTimeout(() => (exportBtn.textContent = 'Copy JSON'), 1200);
      } catch {
        prompt('Copy this JSON:', json);
      }
    });
  </script>
</body>
</html>
